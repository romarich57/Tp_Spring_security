name: Tests Spring Security

on:
  push:
    branches:
      - 'Tp_version*'
  pull_request:
    branches:
      - main

jobs:
  maven-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compiler et lancer les tests
        run: mvn -B -ntp clean verify
