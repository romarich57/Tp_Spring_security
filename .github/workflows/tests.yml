name: Tests Spring Security et React

on:
  push:
    branches:
      - 'Tp_version*'
  pull_request:
    branches:
      - main

jobs:
  spring-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Vérifier le backend
        run: mvn -B -ntp clean verify

  react-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dependances React
        run: npm install --no-audit --no-fund
      - name: Tests React
        run: npm test
      - name: Compiler React
        run: npm run build
